<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfcf8">
  <meta name="description" content="한국어 문장을 쓰고 피드백과 맞춤 연습을 받는 Kontext">
  <title>Kontext · 한국어 문장 연습</title>
  <link rel="stylesheet" href="/static/styles.css?v=kontext-7">
  <script src="/static/app.js?v=kontext-5" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">K</span><span>Kontext</span></div>
    </header>
    <nav class="tabbar" aria-label="학습 화면">
      <button type="button" class="tab active" data-view="write" aria-current="page">문장 연습</button>
      <button type="button" class="tab" data-view="record">학습 기록</button>
    </nav>
    <main>
      <section class="view" data-view-panel="write">
        <section class="card composer" aria-labelledby="input-title">
          <h1 id="input-title">한 문장 써볼까요?</h1>
          <p class="intro">편하게 적으면 표현을 살펴보고 연습문제를 만들어 드려요.</p>
          <label for="utterance">내 문장</label>
          <textarea id="utterance" maxlength="2000" rows="5" placeholder="예: 어제 친구와 영화를 봤어요."></textarea>
          <div class="input-footer"><span>예시로 시작하기</span><span id="char-count">0 / 2,000</span></div>
          <div class="examples"><button type="button" class="example-button" data-example="wrong">틀린 문장</button><button type="button" class="example-button" data-example="everyday">일상 문장</button></div>
          <div id="configuration" class="notice" role="status" hidden></div>
          <button id="analyze-button" class="primary-button" type="button" disabled>내 문장 살펴보기</button>
        </section>
        <div id="results" class="results" aria-live="polite" hidden>
          <h2>표현 살펴보기</h2>
          <p id="overall" class="overall"></p>
          <div id="analysis-cards" class="stack"></div>
          <h2 class="practice-head">한 문제 연습하기</h2>
          <div id="practice-cards" class="stack"></div>
          <button id="again-button" class="secondary-button" type="button">다른 문장도 연습하기</button>
          <details class="card update-card"><summary>학습 기록에 반영된 내용</summary><div id="tool-results"></div></details>
          <details class="card inspector"><summary><span><strong>분석 과정 보기</strong><small>입력·검색·생성·저장 단계</small></span></summary><div id="trace"><p class="muted">문장을 분석하면 단계별 실행 기록이 표시됩니다.</p></div></details>
        </div>
      </section>
      <section class="view" data-view-panel="record" hidden>
        <section class="card profile-card"><div id="profile"></div><p class="small-note">처음 5건은 예시 기록입니다.</p><h2>최근 연습</h2><div id="history"></div></section>
      </section>
    </main>
  </div>
</body>
</html>
