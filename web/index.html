<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="한국어 문장을 쓰면 고칠 곳과 근거, 그 답이 만들어진 과정까지 보여 주는 학습 데모">
  <meta property="og:title" content="kontext · 한국어 문장 연습">
  <meta property="og:description" content="고칠 곳과 문법 근거, 그리고 그 답이 만들어진 과정을 함께 보여 줍니다.">
  <meta property="og:type" content="website">
  <title>kontext · 한국어 문장 연습</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Cpath d='M8 24h16' stroke='%232b44e7' stroke-width='3'/%3E%3Cpath d='M11 7v12M11 14l7-7M13 12l6 7' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/styles.css?v=2">
  <script src="/static/app.js?v=2" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="logo" href="/" aria-label="kontext 처음으로">kon<span>text</span></a>
      <nav class="top-nav" aria-label="주 메뉴">
        <button type="button" class="nav-link" data-view="write" aria-current="page">문장 연습</button>
        <button type="button" class="nav-link" data-view="record">학습 기록</button>
        <a class="nav-link" href="https://velog.io/@olivia02/series/LLM.zip-압축-해제" target="_blank" rel="noopener noreferrer">코드 해설</a>
        <a class="nav-link" href="https://github.com/juvia2/kontext" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    <div id="view-write" class="layout">
      <section class="composer">
        <label for="utterance">한국어로 한 문장 써 보세요</label>
        <textarea id="utterance" rows="3" maxlength="500" placeholder="예: 어제 친구와 영화를 봤어요."></textarea>
        <div class="composer-row">
          <div class="examples">
            <span>예시</span>
            <button type="button" class="text-button" data-example="fix">고칠 곳이 있는 문장</button>
            <button type="button" class="text-button" data-example="clean">자연스러운 문장</button>
          </div>
          <span id="count" class="count">0 / 500</span>
        </div>
        <p id="notice" class="notice" role="status" hidden></p>
        <button id="analyze" class="primary" type="button" disabled>살펴보기</button>
      </section>

      <section id="failure" class="failure" role="alert" hidden>
        <h2>분석을 끝내지 못했어요</h2>
        <p id="failure-text"></p>
        <button id="retry" type="button" class="dark">다시 시도</button>
      </section>

      <section id="result" class="result" aria-live="polite" hidden>
        <div class="sentence-block">
          <h2 class="eyebrow">내 문장</h2>
          <p id="sentence" class="sentence"></p>
          <div id="legend" class="legend"></div>
          <p id="overall" class="overall"></p>
          <p id="corrected" class="corrected" hidden></p>
        </div>
        <div id="findings"></div>
        <ul id="notes" class="notes"></ul>
        <section id="practice" class="practice" hidden></section>
        <button id="again" type="button" class="primary">다른 문장 쓰기</button>
      </section>

      <aside id="process" class="process" aria-label="분석 과정" hidden>
        <h2>이 답이 만들어진 과정</h2>
        <p class="process-intro"><strong class="who-model">모델</strong>이 한 일과 <strong>코드</strong>가 한 일을 나눠서 보여 줍니다.</p>
        <dl id="totals" class="totals"></dl>
        <ol id="steps" class="steps"></ol>
      </aside>
    </div>

    <div id="view-record" class="record" hidden>
      <h1>학습 기록</h1>
      <div id="stats" class="stats"></div>
      <section>
        <div class="section-head"><h2>자주 고친 문법</h2><span>최근 30건</span></div>
        <div id="patterns"></div>
      </section>
      <section>
        <div class="section-head"><h2>최근</h2></div>
        <div id="history"></div>
      </section>
      <section class="settings">
        <h2>설명 맞춤 설정</h2>
        <div class="settings-row">
          <label>한국어 수준
            <select id="level"></select>
          </label>
          <label>모국어
            <select id="native">
              <option value="">선택 안 함</option>
              <option>영어</option><option>일본어</option><option>중국어</option><option>베트남어</option>
              <option>스페인어</option><option>프랑스어</option><option>러시아어</option><option>그 밖의 언어</option>
            </select>
          </label>
        </div>
        <p>설명의 난이도를 맞추는 데 씁니다. 기록은 이 브라우저에만 연결되며 로그인 기능은 없습니다.</p>
      </section>
    </div>
  </main>

  <nav class="tabbar" aria-label="학습 화면">
    <button type="button" class="tab" data-view="write" aria-current="page">문장 연습</button>
    <button type="button" class="tab" data-view="record">학습 기록</button>
  </nav>
</body>
</html>
